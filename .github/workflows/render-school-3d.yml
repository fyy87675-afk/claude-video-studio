name: Render Madrasati 3D School Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-engine/package-lock.json

      - name: Install Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          fc-cache -f

      - name: Install dependencies
        working-directory: video-engine
        run: npm ci

      - name: Install Remotion browser
        working-directory: video-engine
        run: npx remotion browser ensure

      - name: Render 3D school test
        working-directory: video-engine
        run: npx remotion render src/index.ts MadrasatiSchool3DTest out/madrasati-school-3d-test.mp4 --codec=h264 --concurrency=1

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: madrasati-school-3d-test
          path: video-engine/out/madrasati-school-3d-test.mp4
          if-no-files-found: error
          retention-days: 7

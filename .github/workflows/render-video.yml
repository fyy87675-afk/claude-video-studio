name: Render Video

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-engine/package-lock.json

      - name: Install dependencies
        working-directory: video-engine
        run: npm ci

      - name: Install Remotion browser
        working-directory: video-engine
        run: npx remotion browser ensure

      - name: Render test video
        working-directory: video-engine
        run: npx remotion render src/index.ts HelloWorld out/hello-world.mp4 --codec=h264 --concurrency=2

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-video
          path: video-engine/out/hello-world.mp4
          if-no-files-found: error
          retention-days: 7
